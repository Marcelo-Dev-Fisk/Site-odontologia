<!DOCTYPE html>
<html lang="pt-BR">
</html><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ondonto Site</title>
    <link rel="stylesheet" href="login.css">
    <style>
             
        body {
            background-color: rgb(255, 255, 255);
            margin: 0;
            transition: .5s;
        }

        .Pages {
            margin: 10px;
            display: flex;
            justify-content: space-between;  
            font-size: 20px;
            list-style-type: none;
        }

        .Pages a {
            text-decoration: none;
            color: rgb(0, 0, 0);
        }

        .loginbox {
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(255, 255, 255);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            padding: 90px;
            border-radius: 10px;
            color:rgb(0, 0, 0);
            border: 2px solid black;
        }

        input {
            border: 1px solid black;
            border-radius: 5px;
            outline: none;
        }
        
        button{
            background-color: rgb(0, 72, 167);
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            color: rgb(255, 255, 255);
            cursor: pointer;
        }
        
        button:hover {
            background-color: rgb(9, 79, 100);

        }

        .caixa {
            width: 100px;
            height: 50px;
            background-color: rgb(75, 75, 75);
            border-radius: 150px;
            position: relative;
        }

        .caixa .ind {
            width: 50px;
            height: 50px;
            background-color: black;
            border-radius: 50%;
            transform: scale(0.9);
            cursor: pointer;
            position: absolute;
            left: 0;
            transition: .5s;
        }

        dl {
            height: 50vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background-color: rgb(0, 0, 0);
        }

        .caixa.dark {
            background-color: rgb(218, 218, 218);
        }

        .caixa.dark .ind {
            left: 50px;
            background-color: white;
        }

        body.dark {
            background-color: rgb(61, 61, 61);
        }

        body.dark h2 {
            color: rgb(255, 255, 255);
        }

        body.dark .loginbox {
            background-color: black;
            border-color: rgb(141, 141, 141);
            color: rgb(255, 255, 255);
        }

        body.dark .Pages a {
            color: rgb(255, 255, 255);
        }

    </style>
</head>
